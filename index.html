<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 爱心弹窗</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #1a1a2e;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* 加载提示 */
.loading {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #1a1a2e;
  z-index: 9999;
  transition: opacity 0.5s, visibility 0.5s;
}
.loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loading .heart-icon {
  font-size: 60px;
  animation: pulse 1s ease-in-out infinite;
}
.loading .text {
  color: #fff;
  margin-top: 16px;
  font-size: 18px;
  letter-spacing: 2px;
}
.loading button {
  margin-top: 24px;
  padding: 12px 40px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #f857a6, #ff5858);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  letter-spacing: 2px;
  transition: transform 0.2s;
}
.loading button:active { transform: scale(0.95); }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* 弹窗容器 */
.popup-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}

/* 弹窗 */
.popup {
  position: absolute;
  width: 260px;
  min-height: 100px;
  border-radius: 16px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  pointer-events: auto;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: pointer;
  transition: transform 0.2s, opacity 0.3s;
}
.popup:hover { transform: scale(1.05); }
.popup.fading { animation: fadeOut 0.3s ease forwards; }

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes fadeOut {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.5); opacity: 0; }
}

.popup .icon {
  font-size: 32px;
  flex-shrink: 0;
}
.popup .content {
  flex: 1;
  min-width: 0;
}
.popup .content .text {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  word-break: break-all;
}

/* 配色方案 */
.popup.scheme-pink    { background: rgba(255, 228, 230, 0.92); color: #BE123C; }
.popup.scheme-blue    { background: rgba(240, 249, 255, 0.92); color: #0369A1; }
.popup.scheme-green   { background: rgba(240, 253, 244, 0.92); color: #15803D; }
.popup.scheme-yellow  { background: rgba(255, 247, 205, 0.92); color: #854D0E; }
.popup.scheme-purple  { background: rgba(250, 245, 255, 0.92); color: #7C3AED; }
.popup.scheme-rose    { background: rgba(255, 241, 242, 0.92); color: #9F1239; }
.popup.scheme-cyan    { background: rgba(236, 254, 255, 0.92); color: #0E7490; }
.popup.scheme-orange  { background: rgba(255, 247, 237, 0.92); color: #9A3412; }

/* 背景粒子 */
.particle {
  position: absolute;
  pointer-events: none;
  animation: floatUp linear forwards;
  font-size: 20px;
  opacity: 0.6;
}
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
  100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
}

/* 提示文字 */
.hint {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  letter-spacing: 1px;
  z-index: 100;
  transition: opacity 0.5s;
  pointer-events: none;
}

/* 移动端适配 */
@media (max-width: 600px) {
  .popup {
    width: 200px;
    min-height: 80px;
    padding: 12px;
    gap: 8px;
    border-radius: 12px;
  }
  .popup .icon { font-size: 24px; }
  .popup .content .text { font-size: 12px; }
}
</style>
</head>
<body>

<!-- 加载页 -->
<div class="loading" id="loading">
  <div class="heart-icon">💖</div>
  <div class="text">点击开始</div>
  <button id="startBtn">💕 打开惊喜 💕</button>
</div>

<!-- 弹窗容器 -->
<div class="popup-container" id="popupContainer"></div>

<!-- 提示 -->
<div class="hint" id="hint">点击任意弹窗可关闭它 · 再次点击屏幕退出</div>

<script>
(function() {
  // ============ 配置 ============
  const TIPS = [
    '记得多喝水哦~', '保持微笑，好运自然来', '今天也要元气满满！',
    '早点休息别熬夜', '今天过得开心吗？', '你是最棒的！',
    '听首喜欢的歌吧', '一切都会好起来', '奖励一下自己吧~',
    '好好爱自己', '好好吃饭', '保持好心情',
    '我想你了', '顺顺利利', '别熬夜', '天凉了多穿衣服',
    '你值得被温柔以待', '今天也要加油呀', '做自己就好',
    '累了就休息一下', '明天会更好', '要开心哦'
  ];

  const ICONS = ['💕', '✨', '🌟', '🎀', '🌷', '🌸', '🍀', '💖', '🌻', '🦋', '🎈', '💝', '🫧', '💫', '🎵', '☀️'];

  const SCHEMES = ['pink', 'blue', 'green', 'yellow', 'purple', 'rose', 'cyan', 'orange'];

  const CENTER_TEXT = '❤ 爱你 ❤';

  const HEART_COUNT = 60;
  const RANDOM_COUNT = 60;
  const HEART_SPEED = 60;    // ms
  const RANDOM_SPEED = 250;  // ms
  const PARTICLE_INTERVAL = 800;

  // ============ 状态 ============
  let allPopups = [];
  let running = false;
  let particleTimer = null;

  const container = document.getElementById('popupContainer');
  const hint = document.getElementById('hint');
  const loading = document.getElementById('loading');

  // ============ 爱心坐标公式 ============
  function heartPoints(cx, cy, scale, n) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = i * 2 * Math.PI / n;
      const x = scale * 16 * Math.pow(Math.sin(t), 3) + cx;
      const y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) + cy;
      pts.push({ x: Math.round(x), y: Math.round(y) });
    }
    return pts;
  }

  // ============ 创建弹窗 ============
  function createPopup(x, y, tip, isCenter) {
    const el = document.createElement('div');
    el.className = 'popup scheme-' + SCHEMES[Math.floor(Math.random() * SCHEMES.length)];

    const icon = ICONS[Math.floor(Math.random() * ICONS.length)];
    const text = isCenter ? CENTER_TEXT : (tip || TIPS[Math.floor(Math.random() * TIPS.length)]);

    const w = 260, h = 100;
    const sw = window.innerWidth, sh = window.innerHeight;
    x = Math.max(0, Math.min(x, sw - w));
    y = Math.max(0, Math.min(y, sh - h));

    el.style.left = x + 'px';
    el.style.top = y + 'px';

    el.innerHTML = '<span class="icon">' + icon + '</span>' +
                   '<div class="content"><span class="text">' + text + '</span></div>';

    el.addEventListener('click', function(e) {
      e.stopPropagation();
      el.classList.add('fading');
      setTimeout(function() {
        if (el.parentNode) el.parentNode.removeChild(el);
        const idx = allPopups.indexOf(el);
        if (idx > -1) allPopups.splice(idx, 1);
      }, 300);
    });

    container.appendChild(el);
    allPopups.push(el);
    return el;
  }

  // ============ 背景粒子 ============
  function spawnParticle() {
    const icons = ['💕', '✨', '💖', '🌟', '🌸', '🦋', '💫', '🎀'];
    const el = document.createElement('span');
    el.className = 'particle';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.bottom = '-30px';
    el.style.animationDuration = (3 + Math.random() * 4) + 's';
    el.style.fontSize = (14 + Math.random() * 20) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', function() { el.remove(); });
  }

  function startParticles() {
    spawnParticle();
    particleTimer = setInterval(spawnParticle, PARTICLE_INTERVAL);
  }

  function stopParticles() {
    if (particleTimer) { clearInterval(particleTimer); particleTimer = null; }
  }

  // ============ 主流程 ============
  async function run() {
    if (running) return;
    running = true;
    loading.classList.add('hidden');
    hint.style.display = 'block';
    startParticles();

    const sw = window.innerWidth;
    const sh = window.innerHeight;
    const scale = Math.min(sw, sh) * 0.025;

    const centerX = sw / 2;
    const centerY = sh / 2 - 30;
    const points = heartPoints(centerX, centerY, scale, HEART_COUNT);

    // 阶段一：爱心形状
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      createPopup(p.x, p.y, null, i === points.length - 1);
      await sleep(HEART_SPEED);
    }

    await sleep(1500);

    // 阶段二：随机散落
    const w = 260, h = 100;
    for (let i = 0; i < RANDOM_COUNT; i++) {
      const x = Math.random() * (sw - w);
      const y = Math.random() * (sh - h);
      createPopup(x, y);
      await sleep(RANDOM_SPEED);
    }

    // 退出提示
    hint.textContent = '点击任意弹窗可关闭它 · 再次点击屏幕退出';
    hint.style.opacity = '1';
  }

  function sleep(ms) {
    return new Promise(function(resolve) { setTimeout(resolve, ms); });
  }

  // ============ 退出 ============
  function quit() {
    running = false;
    stopParticles();
    hint.style.display = 'none';

    const popups = allPopups.slice();
    popups.forEach(function(el, i) {
      setTimeout(function() {
        el.classList.add('fading');
        setTimeout(function() {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 300);
      }, i * 20);
    });
    allPopups = [];

    // 清理粒子
    document.querySelectorAll('.particle').forEach(function(el) { el.remove(); });

    // 显示加载页
    setTimeout(function() {
      loading.classList.remove('hidden');
    }, 1000);
  }

  // ============ 事件绑定 ============
  document.getElementById('startBtn').addEventListener('click', run);

  // 点击空白区域退出
  document.addEventListener('click', function(e) {
    if (running && e.target === document.body || e.target === container) {
      quit();
    }
  });

  // 键盘退出
  document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'Escape') {
      e.preventDefault();
      if (running) quit();
      else run();
    }
  });

  // 窗口大小变化时更新
  window.addEventListener('resize', function() {
    if (running) quit();
  });
})();
</script>

</body></html>
